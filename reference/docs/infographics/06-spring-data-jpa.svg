<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<style>
 text { font-family: Arial, sans-serif; fill: #172033; }
 .title { font-size: 34px; font-weight: 700; }
 .subtitle { font-size: 20px; fill: #4b5870; }
 .box { fill: #eef4ff; stroke: #496a9f; stroke-width: 2; rx: 18; }
 .box2 { fill: #f2fbf5; stroke: #4b8761; stroke-width: 2; rx: 18; }
 .label { font-size: 21px; font-weight: 700; text-anchor: middle; }
 .small { font-size: 17px; text-anchor: middle; fill: #3c4a60; }
 .footer { font-size: 18px; fill: #44516a; }
 .arrow { stroke: #56677f; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
</style>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#56677f"/></marker></defs>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="60" y="70" class="title">Spring Data JPA: relational database integration</text>
<text x="60" y="108" class="subtitle">Map Java domain objects to tables and keep common CRUD and query code small and testable.</text>
<rect x="60" y="220" width="210" height="150" class="box"/><text x="165.0" y="262" class="label">REST / service</text><text x="165.0" y="298" class="small">create order </text><text x="165.0" y="323" class="small"> find customer orders</text><rect x="340" y="220" width="230" height="150" class="box2"/><text x="455.0" y="262" class="label">Repository</text><text x="455.0" y="298" class="small">JpaRepository </text><text x="455.0" y="323" class="small"> derived queries</text><rect x="660" y="220" width="230" height="150" class="box"/><text x="775.0" y="262" class="label">Hibernate / JPA</text><text x="775.0" y="298" class="small">entity mapping </text><text x="775.0" y="323" class="small"> SQL generation</text><rect x="980" y="220" width="170" height="150" class="box2"/><text x="1065.0" y="262" class="label">Database</text><text x="1065.0" y="298" class="small">orders table </text><text x="1065.0" y="323" class="small"> indexes </text><text x="1065.0" y="348" class="small"> transactions</text><path d="M 270 295 L 335 295" class="arrow"/><path d="M 570 295 L 655 295" class="arrow"/><path d="M 890 295 L 970 295" class="arrow"/><text x="60" y="675" class="footer">Code map: @Entity → JpaRepository&lt;CustomerOrder, Long&gt; → repository.save(...) and findByCustomerIdOrderByIdDesc(...).</text></svg>