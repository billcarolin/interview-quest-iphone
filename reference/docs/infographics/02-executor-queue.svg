<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<style>
 text { font-family: Arial, sans-serif; fill: #172033; }
 .title { font-size: 34px; font-weight: 700; }
 .subtitle { font-size: 20px; fill: #4b5870; }
 .box { fill: #eef4ff; stroke: #496a9f; stroke-width: 2; rx: 18; }
 .box2 { fill: #f2fbf5; stroke: #4b8761; stroke-width: 2; rx: 18; }
 .label { font-size: 21px; font-weight: 700; text-anchor: middle; }
 .small { font-size: 17px; text-anchor: middle; fill: #3c4a60; }
 .footer { font-size: 18px; fill: #44516a; }
 .arrow { stroke: #56677f; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
</style>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#56677f"/></marker></defs>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="60" y="70" class="title">Executor pool + thread-safe queue</text>
<text x="60" y="108" class="subtitle">Separate task submission from worker management and let BlockingQueue safely coordinate producer and consumer threads.</text>
<rect x="60" y="220" width="240" height="150" class="box"/><text x="180.0" y="262" class="label">Producers</text><text x="180.0" y="298" class="small">HTTP requests </text><text x="180.0" y="323" class="small"> message listener </text><text x="180.0" y="348" class="small"> scheduled task</text><rect x="370" y="220" width="250" height="150" class="box2"/><text x="495.0" y="262" class="label">BlockingQueue</text><text x="495.0" y="298" class="small">thread-safe buffer </text><text x="495.0" y="323" class="small"> queue.add(...) </text><text x="495.0" y="348" class="small"> queue.poll(...)</text><rect x="700" y="150" width="210" height="120" class="box"/><text x="805.0" y="192" class="label">Worker 1</text><text x="805.0" y="228" class="small">ExecutorService </text><text x="805.0" y="253" class="small"> fixed pool</text><rect x="700" y="320" width="210" height="120" class="box2"/><text x="805.0" y="362" class="label">Worker 2</text><text x="805.0" y="398" class="small">ExecutorService </text><text x="805.0" y="423" class="small"> fixed pool</text><rect x="980" y="220" width="170" height="150" class="box"/><text x="1065.0" y="262" class="label">Output</text><text x="1065.0" y="298" class="small">database </text><text x="1065.0" y="323" class="small"> API call </text><text x="1065.0" y="348" class="small"> metrics</text><path d="M 300 295 L 365 295" class="arrow"/><path d="M 620 285 L 690 210" class="arrow"/><path d="M 620 305 L 690 380" class="arrow"/><path d="M 910 210 L 970 270" class="arrow"/><path d="M 910 380 L 970 320" class="arrow"/><text x="60" y="675" class="footer">Interview note: a bounded queue plus an intentional rejection policy is usually safer under sustained overload.</text></svg>